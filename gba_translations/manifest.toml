format_version = 1
id = "ffv.gba-translations"
version = "0.1.0"
name = "GBA Translations"
author = "kindle4Light"
description = "Translate texts from Japanese to the following languages: English, German, French, Italian, and Spanish. It uses the GBA ROM as reference."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "ffv-jp"
rom_sha256 = "c6858d5c02894a6cc71f4dd452c7f288b319d1952ca56fdb185b4bf5e26244a2"

[[feature]]
id = "lang"
name = "Language"
description = "Select the text language applied at runtime."
group = "Languages"

[[option]]
feature = "lang"
id = "lang-opt"
label = "Language"
description = "Runtime text language."
group = "Languages"
type = "choice"
default = "en"

[[option.choice]]
value = "en"
label = "English"

[[option.choice]]
value = "de"
label = "German"

[[option.choice]]
value = "fr"
label = "French"

[[option.choice]]
value = "it"
label = "Italian"

[[option.choice]]
value = "es"
label = "Spanish"

[[resource]]
feature = "lang"
id = "gba-rom"
label = "Select the FFV PAL GBA Rom"
format = "file"
file_patterns = "*.gba"
file_description = "GBA Rom (*.gba)"
required = true